<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect width="120" height="120" rx="26" fill="#181a1e"/>
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Stylized circuit V in silver/white -->
  <g>
    <!-- V branch -->
    <path d="M 28 34 L 52 82 L 60 90 L 68 82 L 92 34" fill="none" stroke="url(#vitGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center circuit node -->
    <circle cx="60" cy="90" r="5" fill="#ffffff"/>
    <!-- Branch nodes -->
    <circle cx="28" cy="34" r="5" fill="#d1d5db"/>
    <circle cx="92" cy="34" r="5" fill="#d1d5db"/>
    <!-- Inner connect line -->
    <circle cx="60" cy="52" r="3.5" fill="#9ca3af"/>
    <line x1="60" y1="52" x2="60" y2="76" stroke="#9ca3af" stroke-width="2.5" stroke-dasharray="2 3"/>
  </g>
</svg>
